general {
    hide_cursor = true
}
background {
    path = ~/.config/hypr/wallpapers/macos.png
    blur_passes = 3
    blur_size = 8
}
label {
    text = cmd[update:1000] date +"%H:%M"
    font_size = 96
    font_family = Inter Display Bold
    color = rgba(ffffffee)
    position = 0, 220
    halign = center
    valign = center
}
label {
    text = cmd[update:60000] date +"%A %-d %B"
    font_size = 22
    font_family = Inter
    color = rgba(ffffffcc)
    position = 0, 130
    halign = center
    valign = center
}
input-field {
    size = 260, 44
    rounding = 22
    outline_thickness = 0
    inner_color = rgba(ffffff33)
    font_color = rgba(ffffffff)
    check_color = rgba(ffffff55)
    fail_color = rgba(ff5f5788)
    placeholder_text = Mot de passe
    dots_center = true
    fade_on_empty = false
    position = 0, -180
    halign = center
    valign = center
}
